services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: maintenance
      POSTGRES_PASSWORD: maintenance_local
      POSTGRES_DB: maintenance
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
